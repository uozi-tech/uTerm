<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <clipPath id="clip-u">
      <rect x="6" y="6" width="88" height="88" rx="22"/>
    </clipPath>
    <filter id="haze-u" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow-prompt" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="black" flood-opacity="0.55"/>
    </filter>
    <filter id="shadow-cursor" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.7" flood-color="#3b82f6" flood-opacity="0.67"/>
    </filter>
    <radialGradient id="neb-a" cx="28%" cy="72%" r="75%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="55%"  stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-b" cx="52%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#a78bfa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-c" cx="78%" cy="26%" r="65%">
      <stop offset="0%"   stop-color="#f472b6" stop-opacity="0.16"/>
      <stop offset="60%"  stop-color="#f472b6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="88" height="88" rx="22"
        fill="#0a0a14"
        stroke="rgba(255,255,255,0.10)" stroke-width="1.4"/>

  <g clip-path="url(#clip-u)">
    <g filter="url(#haze-u)">
      <rect x="6" y="6" width="88" height="88" fill="url(#neb-a)"/>
      <rect x="6" y="6" width="88" height="88" fill="url(#neb-b)"/>
      <rect x="6" y="6" width="88" height="88" fill="url(#neb-c)"/>
    </g>
    <rect x="6" y="6" width="88" height="88" fill="#ffffff" opacity="0.018"/>

    <path d="M30 38 Q44 50 30 62"
          stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          fill="none" opacity="0.96"
          filter="url(#shadow-prompt)"/>
    <rect x="50" y="60" width="22" height="6" rx="3" fill="#3b82f6"
          filter="url(#shadow-cursor)"/>
  </g>
</svg>

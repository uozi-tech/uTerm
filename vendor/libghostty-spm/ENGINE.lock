# 终端引擎的二进制清单。二进制不进版本库：`make engine`（scripts/fetch-ghostty-engine.sh）按这份清单取 zip、
# 校验 sha256、解到 BinaryTarget/；取不到 zip 时退到 scripts/build-ghostty-engine.sh，按下面「来源」几行从上游源码现编
# （也可以手动 `make engine-build`）。格式是 key=value，一行一项，# 开头的是注释；键名不要改，脚本和单测都按键名读。
#
# 换二进制（换 Ghostty 提交、加减引擎补丁）时三处一起改，步骤见 UTERM-PATCHES.md「升级步骤」：
#   1. 这里的 zip 文件名与 sha256；
#   2. 这里的 engine_version；
#   3. uTerm/Features/Terminal/Shadow/TerminalEngine.swift 的 TerminalEngineVersion.current（必须和 engine_version 一字不差，
#      两端的 TerminalEngineLockTests 拦着）。

# 引擎版本串：Ghostty 提交 + 引擎补丁的最大编号 + 快照格式的修订号。远控握手和 holder 检查点靠它判断是不是同一个引擎。
engine_version=ghostty-56de3f0f+p0026/snapshot-1

# 来源。fetch 脚本不读；build-ghostty-engine.sh 按它们现编：克隆这个 tag 并核对提交前缀、核对它的 Ghostty.ref 等于
# ghostty_commit（写全 40 位），用这一版 Zig（没有就从 ziglang.org 下，按 zig_aarch64_macos_sha256 核）。
libghostty_spm_tag=2.2.2026112401
libghostty_spm_commit=df874b7f
ghostty_commit=56de3f0f6786a3ff4f971d075a28f73409212983
zig_version=0.17.1
zig_aarch64_macos_sha256=75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d

# GhosttyKit（完整的 libghostty：解析 + 渲染）。23 个上游补丁（0022 是逐像素平滑滚动；0023 是滚动那一帧交到图层的信号，
# 原来是我们的 0024，2026-11-23 进了上游）+ 我们的 0024 最低对比度（原来的 0023，文件没改、只改了号）。
# 2026-11-24 换到上游 2.2.2026112401：补丁还是这 24 个，Ghostty 提交从 5ebe501a 换成 56de3f0f，所以 engine_version 换了。
# 同一天加了我们的 0025（空闲后的第一帧当场画，只改渲染；p0024 记进 TerminalEngineVersion.sameSnapshotFormat）。
# 2026-11-25 加了我们的 0026（按键的回显那一帧也当场画，只改渲染；p0025 同样记进 sameSnapshotFormat）。
ghosttykit_zip=GhosttyKit-56de3f0f-0026.xcframework.zip
ghosttykit_sha256=d7069f7211e12633f995231e5e03c7d142bba6df1cd4591354d3acd1024b2c65
ghosttykit_dir=GhosttyKit.xcframework

# libghostty-vt（影子终端）。和 GhosttyKit 同一棵打过补丁的源码树编的，每个 slice 预链接、只导出 ghostty_*。
ghosttyvt_zip=ghostty-vt-56de3f0f-0026.xcframework.zip
ghosttyvt_sha256=0af2799f4cca5addd945157e1270f64a2c56bfb703ad89973d7564ede0b5e3e1
ghosttyvt_dir=ghostty-vt.xcframework

# 不发布二进制（已定）：zip 只给维护者本机用（环境变量 UTERM_GHOSTTY_ARTIFACTS 指向的目录），脚本不联网下载。
# 别人的机器上没有 zip，make engine 按上面「来源」几行从上游源码现编（约 15 分钟，会下载 Zig 与 Ghostty 源码）。

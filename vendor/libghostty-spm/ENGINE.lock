# 终端引擎的二进制清单。二进制不进版本库：`make engine`（scripts/fetch-ghostty-engine.sh）按这份清单取 zip、
# 校验 sha256、解到 BinaryTarget/。格式是 key=value，一行一项，# 开头的是注释；键名不要改，脚本和单测都按键名读。
#
# 换二进制（换 Ghostty 提交、加减引擎补丁）时三处一起改，步骤见 UTERM-PATCHES.md「升级步骤」：
#   1. 这里的 zip 文件名与 sha256；
#   2. 这里的 engine_version；
#   3. uTerm/Features/Terminal/Shadow/TerminalEngine.swift 的 TerminalEngineVersion.current（必须和 engine_version 一字不差，
#      两端的 TerminalEngineLockTests 拦着）。

# 引擎版本串：Ghostty 提交 + 引擎补丁的最大编号 + 快照格式的修订号。远控握手和 holder 检查点靠它判断是不是同一个引擎。
engine_version=ghostty-042b16b6+p0023/snapshot-1

# 来源（只是记录，脚本不读）。
libghostty_spm_tag=2.2.2026110702
libghostty_spm_commit=1d84cf66
ghostty_commit=042b16b6146ada29877dfeeea9f286889e4adeb1
zig_version=0.17.0

# GhosttyKit（完整的 libghostty：解析 + 渲染）。21 个上游补丁 + 0022 最低对比度 + 0023 逐像素平滑滚动。
ghosttykit_zip=GhosttyKit-0023.xcframework.zip
ghosttykit_sha256=5cf2e5d9975a6ce62ae5d0af2a21f752568817d3130a5ec6548181513f768c98
ghosttykit_dir=GhosttyKit.xcframework

# libghostty-vt（影子终端）。和 GhosttyKit 同一棵打过补丁的源码树编的，每个 slice 预链接、只导出 ghostty_*。
ghosttyvt_zip=ghostty-vt.xcframework.zip
ghosttyvt_sha256=45e5f5670c9b7ea9adc7edd0d4156ffdc0d7362f3753f69e9db11167b8e40011
ghosttyvt_dir=ghostty-vt.xcframework

